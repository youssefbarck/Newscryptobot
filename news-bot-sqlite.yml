# ============================================================================
#  بوت الأخبار — وضع SQLite (بديل بدون قاعدة بيانات خارجية)
#  الحالة تُخزن في data/state.db وتُرفع (commit) إلى المستودع بعد كل تشغيلة.
#
#  ⚠️ مناسب للتجربة أو الحمل الخفيف فقط:
#  - تاريخ المستودع يكبر مع كل تشغيلة.
#  - يتطلب السماح بـ Actions بالكتابة: Settings → Actions → General →
#    Workflow permissions → Read and write permissions
#
#  يحتاج 4 أسرار: TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION, GEMINI_API_KEY
#  فعّل هذا الملف وعطّل news-bot.yml (أو احذف أحدهما) — لا تشغلهما معاً
# ============================================================================
name: news-bot-sqlite

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write   # ضروري لحفظ قاعدة البيانات في المستودع

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل البوت
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # لا DATABASE_URL → يعمل بوضع SQLite على data/state.db
        run: python bot.py

      - name: حفظ قاعدة البيانات في المستودع
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/state.db 2>/dev/null || echo "لا توجد قاعدة بيانات بعد"
          if git diff --cached --quiet; then
            echo "لا تغييرات — لا حاجة للرفع"
          else
            git commit -m "chore: تحديث حالة البوت [skip ci]"
            git push
          fi
