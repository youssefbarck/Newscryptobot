name: Crypto News Bot

on:
  schedule:
    # كل 30 دقيقة (توقيت UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions

permissions:
  contents: write  # ضروري لـ auto-commit ملف sent_news.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: 💾 Commit sent_news.json
        run: |
          git config user.name "news-bot[bot]"
          git config user.email "news-bot[bot]@users.noreply.github.com"
          git add sent_news.json
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore: update sent_news.json [skip ci]"
            git push
          echo "✅ Committed sent_news.json"
          fi
