name: Crypto News Bot

on:
  schedule:
    # كل 30 دقيقة (بتوقيت UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: write  # ضروري لـ auto-commit ملف sent_news.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # تثبيت حزم النظام المطلوبة لـ matplotlib
          sudo apt-get update -qq && sudo apt-get install -y -qq libfreetype6-dev fonts-dejavu 2>/dev/null || true

      - name: 🚀 Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: 💾 Commit sent_news.json (preserve dedup state)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # إضافة ملف الهاشات إن تغيّر
          git add sent_news.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore: update sent_news.json [skip ci]"
            git push
          fi
