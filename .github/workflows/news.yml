name: "📰 Crypto News Bot"

on:
  schedule:
    # كل 15 دقيقة — الخبر القوي يُرسل فور ظهوره تقريبًا بدل انتظار ساعتين.
    # الدقائق مبعرفة عن :00/:15/:30/:45 لتفادي ازدحام طابور GitHub المجدول.
    # منع التكرار (بصمات + تشابه) يضمن عدم وصول نفس الخبر مرتين مهما كثرت الجولات.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التشغيل (full: إرسال فعلي | test: رسالة تجربة | dry: طباعة دون إرسال | doctor: فحص تشخيصي)"
        type: choice
        default: "full"
        options:
          - full
          - test
          - dry
          - doctor

permissions:
  contents: write

concurrency:
  group: crypto-news
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "تحميل المستودع"
        uses: actions/checkout@v5

      - name: "إعداد بايثون 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: "تثبيت المتطلبات"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "تشغيل البوت"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          CHANNEL_TAG: ${{ vars.CHANNEL_TAG }}
          MAX_POSTS_PER_RUN: "3"
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          case "$MODE" in
            test)   python main.py --test ;;
            dry)    python main.py --dry-run ;;
            doctor) python main.py --doctor ;;
            *)      python main.py ;;
          esac

      # يرفع سجل الأخبار المرسلة فقط عند إرسال فعلي — لا commits فارغة كل ربع ساعة
      - name: "حفظ سجل منع التكرار"
        if: always()
        continue-on-error: true
        run: |
          mkdir -p data .github/state
          [ -f data/sent_news.json ] || printf '{"seen": {}}' > data/sent_news.json
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "last_run_at=$DATE" > .github/state/last_alive.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "📦 بصمات الذاكرة الآن: $(python3 -c "import json;print(len(json.load(open('data/sent_news.json')).get('seen',{})))" 2>/dev/null || echo 0)"
          git add data/sent_news.json
          if git diff --cached --quiet; then
            echo "لا أخبار جديدة — لا حاجة لحفظ"
          else
            git commit -m "chore(bot): sent $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ سجل منع التكرار رُفع للمستودع — الجولات القادمة لن تعيد نفس الأخبار"
            else
              echo "🚨 فشل رفع سجل منع التكرار! الجولات القادمة ستعيد نفس الأخبار — راجع صلاحيات الدفع"
              exit 1
            fi
          fi
