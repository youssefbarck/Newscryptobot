name: 📊 US Market Indices

on:
  schedule:
    # الافتتاح: 9:30 AM ET = 13:30 UTC ( EDT صيفي )
    - cron: '30 13 * * 1-5'
    # الإغلاق: 4:00 PM ET = 20:00 UTC ( EDT صيفي )
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      session_type:
        description: 'Market session type'
        required: false
        default: 'open'
        type: choice
        options:
          - open
          - close

jobs:
  market-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 📊 Send Market Update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import asyncio
          from bot import send_post
          from market_chart import run_market_update

          async def main():
              session = '${{ github.event.inputs.session_type || \"auto\" }}'

              # تحديد نوع الجلسة تلقائياً حسب الوقت
              if session == 'auto':
                  from datetime import datetime, timezone, timedelta
                  now = datetime.now(timezone.utc)
                  hour = now.hour
                  # الافتتاح 13:30 UTC → قبل 15:00 UTC يُعتبر افتتاح
                  # الإغلاق 20:00 UTC → بعد 18:00 UTC يُعتبر إغلاق
                  if hour < 17:
                      session = 'open'
                  else:
                      session = 'close'
                  print(f'Auto-detected session: {session}')

              await run_market_update(send_post, session_type=session)

          asyncio.run(main())
          "
