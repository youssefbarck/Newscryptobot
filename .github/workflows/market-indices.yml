name: Market Indices

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'Session type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - open
          - close

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aiohttp matplotlib
      - name: Run
        working-directory: ./
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_indices.py "${{ github.event.inputs.session || 'auto' }}"
