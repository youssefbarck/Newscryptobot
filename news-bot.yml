# ============================================================================
#  بوت الأخبار — وضع Postgres (الموصى به للإنتاج)
#  يحتاج 5 أسرار في Settings → Secrets and variables → Actions:
#    TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION,
#    GEMINI_API_KEY, DATABASE_URL   (رابط Neon المجاني)
#  الجدولة كل 10 دقائق — عدّل cron حسب حاجتك
# ============================================================================
name: news-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقائق (GitHub قد يضيف تأخيراً بسيطاً أحياناً)
  workflow_dispatch: {}       # زر تشغيل يدوي من صفحة Actions

# منع تشغيل نسختين معاً — حماية مطلقة من تكرار النشر
concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل البوت
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python bot.py
