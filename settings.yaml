# ============================================================
#  إعدادات بوت الأخبار — عدّل هذا الملف مباشرة في GitHub
#  الأسرار (التوكنات والمفاتيح) تُوضع في GitHub Secrets وليس هنا
# ============================================================

# ---- القنوات المصدر ----
# يُفضّل كتابتها بصيغة @username (الأضمن على خطة Actions المجانية)
# يمكنك أيضاً استخدام: https://t.me/channel_name
source_channels:
  - "@CoinDesk"
  - "@cointelegraph"

# ---- قناة النشر ----
# يجب أن يكون حساب التيليجرام المستخدم في TELEGRAM_SESSION أدمن فيها بصلاحية "نشر الرسائل"
destination_channel: "@example_news"

# انضمام تلقائي لقنوات المصدر عند أول تشغيل (يحسّن الموثوقية ويخفف الفلوود)
auto_join: true

# ---- قالب المنشور ----
# المتغيرات المتاحة: {title} {body} {source} {ticker_line}
# الصيغة HTML — {ticker_line} يُستبدل بسطر العملة تلقائياً عند توفر Ticker مؤكد، وإلا يُزال
post_template: |
  📰 <b>{title}</b>

  {body}

  {ticker_line}📌 المصدر: {source}

# ---- معالجة المحتوى ----
processing:
  rewrite_enabled: true        # false = نشر الخبر كما هو مع تنظيف بسيط وبدون ذكاء اصطناعي
  min_post_length: 80          # تجاهل المنشورات الأقصر من هذا العدد (إعلانات/تحيات قصيرة)
  max_post_length: 4000        # تجاهل المنشورات الأطول من هذا العدد (مقالات ضخمة)
  max_body_chars: 900          # الحد الأقصى لطول نص الخبر بعد إعادة الصياغة
  strict_numbers: false        # true = رفض الخبر بالكامل إذا سقط رقم من المصدر بعد إعادة المحاولة
  media:
    enabled: true              # نشر الصور/الفيديوهات مع الخبر
    max_media_mb: 40           # تجاهل الوسائط الأكبر من هذا الحجم (بالـ ميجابايت)
    include_media_only_posts: false   # معالجة المنشورات التي تحتوي وسائط بدون نص

# ---- منع التكرار ----
dedup:
  similarity_threshold: 86     # 0-100: درجة التشابه التي تعتبر الخبرين واحداً
  window_hours: 72             # مقارنة الخبر الجديد مع ما نُشر خلال هذه الساعات فقط

# ---- حدود النشر ----
limits:
  max_posts_per_minute: 4      # حماية من الفلوود داخل التشغيلة الواحدة
  max_posts_per_run: 10        # أقصى عدد أخبار تُنشر في التشغيلة الواحدة (البقية تبقى للمرة القادمة)
  post_delay_seconds: 8        # فاصل زمني إلزامي بين منشور وآخر

# ---- التصفية ----
filters:
  ignore_keywords:             # كلمات تُتجاهل المنشور فوراً إن ظهرت في نصه (غير حساسة لحالة الأحرف)
    - "إعلان"
    - "بالتعاون مع"
    - "sponsored"
    - "promo"
    - "giveaway"
    - "airdrop claim"
  # ignore_channels:            # قنوات مصدر معطلة مؤقتاً (بدون حذفها من الأعلى)
  #   - "@old_channel"

# ---- المزامنة ----
sync:
  fetch_limit_per_channel: 30  # أقصى عدد منشورات تُجلب لكل قناة في التشغيلة (التراكم يُكمل تدريجياً)
  on_first_run: "skip_to_latest"   # skip_to_latest = تجاهل التاريخ القديم | process_backlog = معالجة آخر fetch_limit منشوراً

# ---- الذكاء الاصطناعي (Gemini) ----
ai:
  model: "gemini-2.0-flash"    # نماذج مجانية أخرى: gemini-2.0-flash-lite, gemini-1.5-flash
  temperature: 0.3
  max_output_tokens: 1500
  timeout_seconds: 60
  max_retries: 3               # محاولات داخل التشغيلة عند فشل النداء

# ---- إعادة المحاولة بين التشغيلات ----
retries:
  max_retries: 3               # أقصى عدد محاولات لكل خبر عبر التشغيلات
  max_age_hours: 24            # الخبر الأقدم من هذا العدد لا يستحق النشر — يُهمل تلقائياً
  batch_size: 10               # أقصى عدد أخبار فاشلة تُعالج من جديد في كل تشغيلة

# ---- الصيانة ----
housekeeping:
  enabled: true
  retention_days: 30           # حذف سجلات المنشورات الأقدم من هذا العدد من الأيام
